{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="custom-card">
                <h2 class="page-title text-center mb-4">{{ txt.create_page }}</h2>
                
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="text-white-50">{{ txt.band_name }}</label>
                        <input type="text" name="title" class="input" placeholder="{{ txt.band_name }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="text-white-50">{{ txt.about_band }}</label>
                        <textarea name="description" class="input" rows="3" placeholder="{{ txt.about_band }}"></textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label class="text-white-50">{{ txt.content }}</label>
                        <textarea name="content" class="input" rows="10" placeholder="{{ txt.content_placeholder }}"></textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label class="text-white-50">{{ txt.cover_image }}</label>
                        <input type="file" name="cover_image" class="form-control" accept="image/*" style="background: #1a1a1a; color: white; border: 1px solid rgba(255,255,255,0.2);">
                        <small class="text-white-50">PNG, JPG, WEBP up to 5MB</small>
                    </div>
                    
                    <div class="mb-4">
                        <label class="text-white-50 d-block mb-2">{{ txt.tracks }} (up to 3)</label>
                        {% for i in range(1, 4) %}
                        <div class="upload-box mb-2" style="padding: 10px;">
                            <div class="row g-2 align-items-center">
                                <div class="col-md-5">
                                    <input type="text" name="track{{ i }}_name" class="input" placeholder="{{ txt.track_name_placeholder }} {{ i }}" style="height: 40px; font-size: 0.9rem;">
                                </div>
                                <div class="col-md-7">
                                    <input type="file" name="track{{ i }}" class="form-control" accept="audio/*" style="background: #1a1a1a; color: white; border: 1px solid rgba(255,255,255,0.2); font-size: 0.85rem;">
                                </div>
                            </div>
                            <small class="text-white-50">{{ txt.upload_audio_hint }}</small>
                        </div>
                        {% endfor %}
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn-search">{{ txt.create_page }}</button>
                        <a href="{{ url_for('index') }}" class="btn-back text-center">{{ txt.back }}</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
